<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<title>Paparazzi Flash</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #000; color: #eee;
    font-family: -apple-system, system-ui, sans-serif; overflow: hidden; }
  #ui { position: relative; z-index: 1; height: 100%; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 16px; padding: 20px; text-align: center; }
  h1 { margin: 0; font-size: 26px; letter-spacing: 4px; text-transform: uppercase; }
  #go { width: 160px; height: 160px; border-radius: 50%; border: 3px solid #fff;
    background: #111; color: #fff; font-size: 24px; font-weight: 700; }
  #go.on { background: #c00; border-color: #f55; }
  #camBtn, #blackBtn { padding: 12px 22px; border-radius: 24px; border: 2px solid #888;
    background: #111; color: #fff; font-size: 16px; font-weight: 600; }
  .btnrow { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  .row { display: grid; grid-template-columns: 110px 170px; align-items: center;
    gap: 10px; font-size: 15px; text-align: left; }
  .checks { display: flex; gap: 18px; font-size: 15px; flex-wrap: wrap; justify-content: center; }
  .checks label { display: flex; align-items: center; gap: 6px; }
  input[type=range] { width: 170px; }
  #status { font-size: 13px; color: #999; min-height: 1.2em; margin: 0; }
  #warn { font-size: 11px; color: #777; max-width: 320px; margin: 0; }

  /* Flash layer sits on top of everything (including blackout) but ignores touches */
  #flash { position: fixed; inset: 0; background: #fff; opacity: 0;
    pointer-events: none; z-index: 5; }
  video { position: fixed; width: 1px; height: 1px; opacity: 0; pointer-events: none; }

  /* Camera view: full-screen feed, nothing else. Tap to exit. */
  body.cam #ui, body.cam #flash { display: none; }
  body.cam video { inset: 0; width: 100%; height: 100%; opacity: 1;
    object-fit: cover; z-index: 3; pointer-events: auto; background: #000; }

  /* Blackout: black screen (screen flash still pops through). Press and hold to exit. */
  #black { position: fixed; inset: 0; background: #000; z-index: 4; display: none;
    touch-action: none; -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; }
  body.black #black { display: block; }
  body.black #ui { display: none; }
</style>
</head>
<body>
<div id="ui">
  <h1>Paparazzi</h1>
  <button id="go">START</button>

  <div class="row"><span>Intensity</span><input type="range" id="intensity" min="1" max="10" value="5"></div>
  <div class="row"><span>Flash brightness</span><input type="range" id="bright" min="5" max="100" value="100"></div>
  <div class="row"><span>Volume</span><input type="range" id="volume" min="0" max="100" value="80"></div>

  <div class="checks">
    <label><input type="checkbox" id="torch" checked> Torch</label>
    <label><input type="checkbox" id="screen" checked> Screen flash</label>
    <label><input type="checkbox" id="sound" checked> Sound</label>
  </div>

  <div class="btnrow">
    <button id="camBtn">CAMERA VIEW</button>
    <button id="blackBtn">BLACKOUT</button>
  </div>

  <p id="status">Tap start and allow camera access (needed for the torch).</p>
  <p id="warn">Contains rapid flashing light. Not suitable for people with photosensitive epilepsy.</p>
</div>
<div id="flash"></div>
<video id="v" playsinline muted autoplay></video>
<div id="black"></div>

<script>
const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const rand = (a, b) => a + Math.random() * (b - a);
const pick = arr => arr[Math.floor(Math.random() * arr.length)];

let track = null, torchOK = false, running = false, wakeLock = null;

/* ---------- Camera + torch ---------- */
async function setupTorch() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' } }, audio: false
    });
    $('v').srcObject = stream;
    await $('v').play().catch(() => {});
    track = stream.getVideoTracks()[0];
    const caps = track.getCapabilities ? track.getCapabilities() : {};
    const isApple = /iPhone|iPad|iPod/.test(navigator.userAgent);
    torchOK = !!caps.torch || isApple;
    await setTorch(false);
    $('status').textContent = torchOK ? 'Torch ready.' : 'No torch control on this device, screen flash only.';
  } catch (e) {
    torchOK = false;
    $('status').textContent = 'Camera not available, screen flash only.';
  }
}

async function ensureCamera() {
  if (!track || track.readyState === 'ended') await setupTorch();
}

async function setTorch(on) {
  if (!track || !torchOK || track.readyState === 'ended') return;
  if (on && !$('torch').checked) return;
  try { await track.applyConstraints({ advanced: [{ torch: on }] }); } catch (e) {}
}

/* ---------- Sound ---------- */
// Optional real recordings: put these files next to index.html. Missing ones are skipped.
const SAMPLE_FILES = {
  shutter: ['shutter1.mp3', 'shutter2.mp3', 'shutter3.mp3'],
  whine:   ['whine.mp3']
};
const samples = { shutter: [], whine: [] };

let ctx = null, master = null, noiseBuf = null;
const cameraVoice = rand(0.85, 1.15); // each phone sounds like a different camera body

function initAudio() {
  try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
  if (ctx) { ctx.resume(); return; }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  ctx = new AC();
  const comp = ctx.createDynamicsCompressor();
  comp.threshold.value = -18; comp.ratio.value = 4;
  master = ctx.createGain();
  master.connect(comp).connect(ctx.destination);
  noiseBuf = ctx.createBuffer(1, Math.floor(ctx.sampleRate * 0.3), ctx.sampleRate);
  const d = noiseBuf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  loadSamples();
}

async function loadSamples() {
  for (const [kind, files] of Object.entries(SAMPLE_FILES)) {
    for (const f of files) {
      try {
        const res = await fetch(f);
        if (!res.ok) continue;
        const data = await res.arrayBuffer();
        samples[kind].push(await ctx.decodeAudioData(data));
      } catch (e) {}
    }
  }
}

function playSample(buf, rate, gain) {
  const s = ctx.createBufferSource();
  s.buffer = buf; s.playbackRate.value = rate;
  const g = ctx.createGain(); g.gain.value = gain;
  s.connect(g).connect(master);
  s.start();
}

function soundOn() {
  if (!ctx || !$('sound').checked) return false;
  master.gain.value = +$('volume').value / 100;
  return true;
}

function noiseHit(t, type, freq, q, dur, gain) {
  const src = ctx.createBufferSource(); src.buffer = noiseBuf;
  const f = ctx.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q;
  const g = ctx.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(gain, t + 0.001);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  src.connect(f).connect(g).connect(master);
  src.start(t, Math.random() * 0.15); src.stop(t + dur + 0.02);
}

function thump(t, freq, dur, gain) {
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.type = 'triangle';
  o.frequency.setValueAtTime(freq, t);
  o.frequency.exponentialRampToValueAtTime(freq * 0.5, t + dur);
  g.gain.setValueAtTime(gain, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(master);
  o.start(t); o.stop(t + dur + 0.02);
}

function synthShutter() {
  const t = ctx.currentTime, v = cameraVoice * rand(0.97, 1.03);
  // "ka" - mirror up + first curtain: sharp clack with body thump
  noiseHit(t, 'highpass', 3500 * v, 0.7, 0.012, 0.9);
  noiseHit(t, 'bandpass', 1400 * v, 1.5, 0.04, 0.7);
  thump(t, 200 * v, 0.045, 0.6);
  // "chak" - mirror down + curtain reset
  const t2 = t + rand(0.045, 0.07);
  noiseHit(t2, 'highpass', 2800 * v, 0.7, 0.01, 0.6);
  noiseHit(t2, 'bandpass', 1100 * v, 1.5, 0.05, 0.55);
  thump(t2, 150 * v, 0.05, 0.45);
}

function shutter() {
  if (!soundOn()) return;
  if (samples.shutter.length) playSample(pick(samples.shutter), cameraVoice * rand(0.97, 1.03), 1);
  else synthShutter();
}

function rechargeWhine() {
  if (!soundOn()) return;
  if (samples.whine.length) { playSample(pick(samples.whine), rand(0.95, 1.05), 0.6); return; }
  const t = ctx.currentTime;
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.type = 'sine';
  o.frequency.setValueAtTime(rand(2500, 3200), t);
  o.frequency.exponentialRampToValueAtTime(rand(8000, 9500), t + 1.1);
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(0.04, t + 0.15);
  g.gain.linearRampToValueAtTime(0, t + 1.1);
  o.connect(g).connect(master);
  o.start(t); o.stop(t + 1.15);
}

/* ---------- Flash engine ---------- */
async function flashPop() {
  const len = rand(35, 60);
  if ($('screen').checked) $('flash').style.opacity = +$('bright').value / 100;
  await setTorch(true);
  await sleep(len);
  $('flash').style.opacity = 0;
  await setTorch(false);
}

function burstFrames() {
  const r = Math.random();
  if (r < 0.35) return 1;                       // single shot
  if (r < 0.6)  return Math.floor(rand(2, 4));  // quick double/triple
  if (r < 0.88) return Math.floor(rand(4, 8));  // short motor-drive burst
  return Math.floor(rand(8, 15));               // full spray
}

async function burst() {
  const n = burstFrames();
  const interval = rand(80, 125);  // 8-12 frames per second
  let flashed = false;
  for (let i = 0; i < n && running; i++) {
    const start = performance.now();
    shutter();
    if (i === 0 || Math.random() < 0.45) { await flashPop(); flashed = true; }
    const left = interval - (performance.now() - start);
    if (left > 0) await sleep(left);
  }
  return flashed;
}

async function loop() {
  await sleep(rand(0, 1500)); // stagger so phones never start together
  while (running) {
    const flashed = await burst();
    if (running && flashed && Math.random() < 0.3) rechargeWhine();
    const k = +$('intensity').value;     // 1 = sparse, 10 = frantic
    const maxGap = 4000 - k * 350;       // 3650ms down to 500ms
    await sleep(rand(150, maxGap));
  }
  $('flash').style.opacity = 0;
  await setTorch(false);
}

async function keepAwake() {
  try {
    if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen');
  } catch (e) {}
}

/* ---------- Controls ---------- */
$('go').addEventListener('click', async () => {
  initAudio(); // must happen straight from the tap for iOS
  if (running) {
    running = false;
    $('go').textContent = 'START';
    $('go').classList.remove('on');
    if (wakeLock) { wakeLock.release().catch(() => {}); wakeLock = null; }
    return;
  }
  await ensureCamera();
  await keepAwake();
  running = true;
  $('go').textContent = 'STOP';
  $('go').classList.add('on');
  loop();
});

$('torch').addEventListener('change', () => { if (!$('torch').checked) setTorch(false); });

// Camera view: tap the feed to exit
$('camBtn').addEventListener('click', async () => {
  initAudio();
  await ensureCamera();
  await keepAwake();
  document.body.classList.add('cam');
});
$('v').addEventListener('click', () => document.body.classList.remove('cam'));

// Blackout: press and hold for 1 second to exit
$('blackBtn').addEventListener('click', async () => {
  initAudio();
  await keepAwake();
  document.body.classList.add('black');
});
let holdTimer = null;
$('black').addEventListener('pointerdown', () => {
  holdTimer = setTimeout(() => document.body.classList.remove('black'), 1000);
});
['pointerup', 'pointercancel', 'pointerleave'].forEach(ev =>
  $('black').addEventListener(ev, () => clearTimeout(holdTimer))
);

// iOS stops the camera when the page is hidden, so recover when it comes back
document.addEventListener('visibilitychange', async () => {
  if (document.visibilityState === 'visible') {
    const b = document.body.classList;
    if (running || b.contains('cam') || b.contains('black')) {
      await ensureCamera();
      await keepAwake();
    }
  }
});
</script>
</body>
</html>
